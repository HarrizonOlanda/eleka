<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEKA P2P</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:420px;margin:0 auto;padding-bottom:20px}
.top{background:#000;padding:16px;border-bottom:2px solid #d4af37}
.logo{font-size:24px;font-weight:900;letter-spacing:3px;color:#d4af37}
.logo span{font-size:10px;display:block;color:#aaa;letter-spacing:1px;font-weight:400}
.nav{display:flex;gap:8px;padding:12px 14px}
.nav a{flex:1;text-align:center;padding:10px;border-radius:20px;text-decoration:none;font-weight:700;font-size:14px}
.nav a.active{background:#d4af37;color:#000}
.nav a:not(.active){background:#151515;color:#fff;border:1px solid #333}
.wallet{margin:0 14px;background:#151515;border:1px solid #d4af37;border-radius:14px;padding:14px;display:flex;justify-content:space-between}
.wallet small{color:#aaa}
.wallet b{color:#d4af37;font-size:18px;display:block}
.tabs{display:flex;gap:8px;margin:14px}
.tabs button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:900}
.tabs button.active{background:#d4af37;color:#000}
.tabs button:not(.active){background:#222;color:#fff}
.card{margin:0 14px 10px;background:#151515;border:1px solid #333;border-radius:12px;padding:14px}
.card h3{font-size:15px}
.card h3 span{color:#00c853;font-size:12px}
.rate{color:#d4af37;font-size:20px;font-weight:900;margin:6px 0}
.card p{color:#aaa;font-size:12px}
.card .row{display:flex;gap:8px;margin-top:10px}
.card input{flex:1;background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:8px}
.card button{background:#d4af37;color:#000;border:none;padding:10px 16px;border-radius:8px;font-weight:900}
</style>
</head>
<body>
<div class="top"><div class="logo">ELEKA<span>Predict. Trade. Cash Out.</span></div></div>
<div class="nav"><a href="index.html">📈 Trade</a><a href="p2p.html" class="active">💱 P2P</a></div>
<div class="wallet"><div><small>KES Balance</small><b>KES 5,000</b></div><div><small>USDT Balance</small><b>12.50 USDT</b></div></div>
<div class="tabs"><button id="buyTab" class="active" onclick="switchTab('buy')">BUY USDT</button><button id="sellTab" onclick="switchTab('sell')">SELL USDT</button></div>
<div id="list"></div>
<script>
let offers=[
{name:"Brian_K",price:132.50,avail:500,min:500,max:50000,type:"buy"},
{name:"MamaNjoroge",price:131.80,avail:1200,min:1000,max:100000,type:"buy"},
{name:"Kevin_KE",price:133.20,avail:250,min:500,max:30000,type:"sell"},
{name:"Faith254",price:132.00,avail:800,min:1000,max:80000,type:"sell"},
];
let mode='buy';
function switchTab(m){mode=m;document.getElementById('buyTab').className=m==='buy'?'active':'';document.getElementById('sellTab').className=m==='sell'?'active':'';render();}
function render(){
let f=offers.filter(o=>o.type===mode);
document.getElementById('list').innerHTML=f.map((o,i)=>`<div class="card"><h3>${o.name} <span>● Online • 98%</span></h3><div class="rate">KES ${o.price} / USDT</div><p>Available: ${o.avail} USDT | Limit: KES ${o.min} - ${o.max} | Pay: M-Pesa</p><div class="row"><input id="amt-${i}" type="number" placeholder="Amount KES e.g 1000"><button onclick="tradeP2P('${o.name}',${o.price},${i})">${mode==='buy'?'BUY':'SELL'}</button></div></div>`).join('');
}
function tradeP2P(name,price,i){
let amt=document.getElementById('amt-'+i).value;
if(!amt){alert('Enter amount in KES');return;}
let usdt=(amt/price).toFixed(2);
alert((mode==='buy'?'You are buying ':'You are selling ')+usdt+' USDT from '+name+' for KES '+amt+' via M-Pesa.');
}
render();
</script>
</body>
</html>
