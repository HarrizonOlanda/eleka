<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEKA P2P - Buy & Sell USDT with M-Pesa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:420px;margin:0 auto;padding-bottom:20px}
.top{background:#000;padding:16px;display:flex;justify-content:space-between;border-bottom:2px solid #d4af37}
.logo{font-size:24px;font-weight:900;letter-spacing:3px;color:#d4af37}
.logo span{font-size:10px;display:block;color:#aaa;letter-spacing:1px;font-weight:400}
.live{color:#00c853;font-size:11px;font-weight:700}
.hero{margin:14px;background:#151515;border:1px solid #d4af37;border-radius:14px;padding:16px;text-align:center}
.hero h1{font-size:20px}
.hero p{color:#aaa;font-size:12px;margin-top:6px}
.hero b{color:#d4af37}
.wallet{margin:0 14px;background:#151515;border:1px solid #333;border-radius:14px;padding:14px;display:flex;justify-content:space-between}
.wallet small{color:#aaa}
.wallet b{color:#d4af37;font-size:18px;display:block}
.tabs{display:flex;gap:8px;margin:14px}
.tabs button{flex:1;padding:14px;border-radius:12px;border:none;font-weight:900;font-size:15px}
.tabs button.active{background:#d4af37;color:#000}
.tabs button:not(.active){background:#222;color:#fff}
.card{margin:0 14px 10px;background:#151515;border:1px solid #333;border-radius:12px;padding:14px}
.card h3{font-size:15px}
.card h3 span{color:#00c853;font-size:12px}
.rate{color:#d4af37;font-size:22px;font-weight:900;margin:6px 0}
.card p{color:#aaa;font-size:12px}
.card .row{display:flex;gap:8px;margin-top:10px}
.card input{flex:1;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;font-size:15px}
.card button{background:#d4af37;color:#000;border:none;padding:12px 16px;border-radius:8px;font-weight:900}
.footer{text-align:center;color:#666;font-size:11px;margin-top:16px;padding:0 14px}
</style>
</head>
<body>
<div class="top"><div class="logo">ELEKA<span>Buy & Sell Crypto with M-Pesa</span></div><div class="live">● P2P LIVE</div></div>

<div class="hero">
<h1>Buy & Sell USDT in Kenya 🇰🇪</h1>
<p>Pay with <b>M-Pesa</b> • Get USDT instantly • <b>KES <span id="liveRate">--</span> / USDT</b></p>
</div>

<div class="wallet"><div><small>KES Balance</small><b>KES 5,000</b></div><div><small>USDT Balance</small><b>12.50 USDT</b></div></div>

<div class="tabs">
<button id="buyTab" class="active" onclick="switchTab('buy')">BUY USDT</button>
<button id="sellTab" onclick="switchTab('sell')">SELL USDT</button>
</div>

<div id="list"></div>

<p class="footer">ELEKA P2P DEMO — In real version, you pay via M-Pesa and seller releases USDT. Escrow protects both sides.</p>

<script>
let offers=[
{name:"Brian_K",price:132.50,avail:500,min:500,max:50000,type:"buy"},
{name:"MamaNjoroge",price:131.80,avail:1200,min:1000,max:100000,type:"buy"},
{name:"Kevin_KE",price:133.20,avail:250,min:500,max:30000,type:"sell"},
{name:"Faith254",price:132.00,avail:800,min:1000,max:80000,type:"sell"},
{name:"Otis254",price:131.50,avail:2000,min:2000,max:200000,type:"buy"},
];
let mode='buy';
function switchTab(m){mode=m;document.getElementById('buyTab').className=m==='buy'?'active':'';document.getElementById('sellTab').className=m==='sell'?'active':'';render();}
function render(){
let f=offers.filter(o=>o.type===mode);
document.getElementById('list').innerHTML=f.map((o,i)=>`<div class="card"><h3>${o.name} <span>● Online • 98% • 120 trades</span></h3><div class="rate">KES ${o.price} / USDT</div><p>Available: ${o.avail} USDT | Limit: KES ${o.min.toLocaleString()} - ${o.max.toLocaleString()} | Pay: M-Pesa</p><div class="row"><input id="amt-${i}" type="number" placeholder="Amount KES e.g 1000"><button onclick="tradeP2P('${o.name}',${o.price},${i})">${mode==='buy'?'BUY':'SELL'}</button></div></div>`).join('');
}
function tradeP2P(name,price,i){
let amt=document.getElementById('amt-'+i).value;
if(!amt){alert('Enter amount in KES');return;}
let usdt=(amt/price).toFixed(2);
alert((mode==='buy'?'You are buying ':'You are selling ')+usdt+' USDT from '+name+' for KES '+amt+' via M-Pesa.\n\nDemo: In real ELEKA, you will send M-Pesa now and seller releases USDT.');
}
render();
// Live USDT rate from Binance (USDT/KES approx via USDT/USD)
fetch('https://data-api.binance.vision/api/v3/ticker/price?symbol=USDTKES').then(r=>r.json()).then(d=>{
document.getElementById('liveRate').innerText=parseFloat(d.price).toFixed(2);
}).catch(()=>{document.getElementById('liveRate').innerText='132.50';});
</script>
</body>
</html>
